<title>A.K. Rajput</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: one centered column on a black field of rising embers. Crown and name on top, two large action buttons, number shown as plain text underneath. */
:root {
  --bg: #070405;
  --panel: #130a0c;
  --ink: #f6eeec;
  --ash: #a3908d;
  --blood: #ff2a3d;
  --ember: #ff6a2b;
  --line: rgba(255, 42, 61, 0.45);
  --font-display: "Pirata One", "Impact", "Arial Black", sans-serif;
  --font-body: "Rajdhani", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}
#embers {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
.glow {
  position: fixed;
  left: 50%;
  bottom: -30vh;
  width: 140vw;
  height: 70vh;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(255, 42, 61, 0.42), rgba(255, 42, 61, 0) 65%);
  z-index: 0;
  pointer-events: none;
}
main {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.crest {
  text-align: center;
}
.crown {
  width: 92px;
  height: auto;
  filter: drop-shadow(0 0 10px rgba(255, 42, 61, 0.9));
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(76px, 24vw, 108px);
  line-height: 0.95;
  letter-spacing: 0.04em;
  background: linear-gradient(180deg, #ffffff 0%, #c9bcbb 45%, #7d6e6d 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 14px rgba(255, 42, 61, 0.75));
}
.tag {
  margin: 4px 0 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--blood);
  padding-left: 0.42em;
}
.actions {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.btn {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  padding: 16px 20px;
  border: 1.5px solid var(--blood);
  background: linear-gradient(135deg, rgba(255, 42, 61, 0.16), rgba(19, 10, 12, 0.92));
  color: var(--ink);
  text-decoration: none;
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  box-shadow: 0 0 22px rgba(255, 42, 61, 0.25);
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn:hover, .btn:focus-visible {
  background: linear-gradient(135deg, rgba(255, 42, 61, 0.42), rgba(19, 10, 12, 0.92));
  transform: translateY(-2px);
  outline: none;
}
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.btn svg { flex: none; width: 30px; height: 30px; }
.btn .label { display: flex; flex-direction: column; min-width: 0; }
.btn .big {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1.1;
}
.btn .small {
  font-size: 16px;
  color: var(--ash);
  overflow-wrap: anywhere;
}
.btn.insta { border-color: var(--ember); box-shadow: 0 0 22px rgba(255, 106, 43, 0.22); }
.btn.insta:hover, .btn.insta:focus-visible {
  background: linear-gradient(135deg, rgba(255, 106, 43, 0.4), rgba(19, 10, 12, 0.92));
}
.number {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  border: 1px dashed var(--line);
  background: rgba(19, 10, 12, 0.8);
}
.number .digits {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums;
  user-select: all;
  -webkit-user-select: all;
  min-width: 0;
  overflow-wrap: anywhere;
}
.copy {
  flex: none;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 8px 14px;
  border: 1px solid var(--blood);
  background: transparent;
  color: var(--blood);
  cursor: pointer;
}
.copy:hover, .copy:focus-visible { background: var(--blood); color: var(--bg); outline: none; }
.note {
  margin: 0;
  text-align: center;
  font-size: 14px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ash);
  padding-left: 0.3em;
}
@media (prefers-reduced-motion: no-preference) {
  .crown { animation: pulse 3.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 42, 61, 0.7)); }
    50% { filter: drop-shadow(0 0 18px rgba(255, 42, 61, 1)); }
  }
}
</style>

<canvas id="embers" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<main>
  <header class="crest">
    <svg class="crown" viewBox="0 0 100 66" fill="none" stroke="#ff2a3d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M8 56 L14 18 L34 38 L50 8 L66 38 L86 18 L92 56 Z"/>
      <path d="M8 56 H92" />
      <circle cx="14" cy="14" r="3.5" fill="#ff2a3d"/>
      <circle cx="50" cy="4.5" r="3.5" fill="#ff2a3d"/>
      <circle cx="86" cy="14" r="3.5" fill="#ff2a3d"/>
    </svg>
    <h1>A.K.</h1>
    <p class="tag">Rajput</p>
  </header>

  <nav class="actions" aria-label="Contact">
    <a class="btn call" href="tel:+919305856926">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff2a3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      <span class="label"><span class="big">Call Me</span><span class="small">+91 93058 56926</span></span>
    </a>
    <a class="btn insta" href="https://www.instagram.com/a.k.rajput256/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff6a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#ff6a2b"/></svg>
      <span class="label"><span class="big">Instagram</span><span class="small">@a.k.rajput256</span></span>
    </a>
  </nav>

  <div class="number">
    <span class="digits" id="digits">+91 93058 56926</span>
    <button class="copy" id="copy" type="button">Copy</button>
  </div>

  <p class="note">Scan &middot; Connect &middot; Rule</p>
</main>

<script>
(function () {
  var btn = document.getElementById("copy");
  var digits = document.getElementById("digits");
  btn.addEventListener("click", function () {
    function fallback() {
      var r = document.createRange();
      r.selectNodeContents(digits);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      btn.textContent = "Selected";
      setTimeout(function () { btn.textContent = "Copy"; }, 1600);
    }
    try {
      navigator.clipboard.writeText("+919305856926").then(function () {
        btn.textContent = "Copied";
        setTimeout(function () { btn.textContent = "Copy"; }, 1600);
      }, fallback);
    } catch (e) { fallback(); }
  });

  var c = document.getElementById("embers");
  var ctx = c.getContext("2d");
  var W = 0, H = 0, parts = [];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * d; c.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function spawn(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + 10,
      r: 0.6 + Math.random() * 2.2,
      vy: 0.25 + Math.random() * 0.9,
      vx: (Math.random() - 0.5) * 0.35,
      a: 0.25 + Math.random() * 0.65,
      hue: Math.random() < 0.7 ? 352 : 18
    };
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.beginPath();
      ctx.fillStyle = "hsla(" + p.hue + ",100%,58%," + p.a + ")";
      ctx.shadowColor = "hsla(" + p.hue + ",100%,55%,0.9)";
      ctx.shadowBlur = 8;
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fill();
    }
  }
  function tick() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.y -= p.vy; p.x += p.vx; p.a -= 0.0007;
      if (p.y < -10 || p.a <= 0) parts[i] = spawn(false);
    }
    draw();
    requestAnimationFrame(tick);
  }
  size();
  var n = W < 600 ? 45 : 90;
  for (var i = 0; i < n; i++) parts.push(spawn(true));
  window.addEventListener("resize", size);
  if (reduce) { draw(); } else { requestAnimationFrame(tick); }
})();
</script>
